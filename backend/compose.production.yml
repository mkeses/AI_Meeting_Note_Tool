services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be configured}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be configured}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    env_file:
      - .env.production
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - backend_model_cache:/home/app/.cache/huggingface
    restart: unless-stopped

  proxy:
    build:
      context: ../frontend
      dockerfile: Dockerfile.production
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be configured}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  backend_model_cache:
  postgres_data:
